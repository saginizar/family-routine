<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>לוח השגרה שלנו 🌟</title>
<style>
/* ══════════════════════════════════════════
   TOKENS & RESET
══════════════════════════════════════════ */
:root {
  --bg:        #fff8f0;
  --bg2:       #ffeedd;
  --card:      #ffffff;
  --card2:     #fdf6ee;
  --border:    #f0e8df;
  --text:      #2d2520;
  --text2:     #7a6a60;
  --accent:    #f5a623;
  --accent2:   #f7c46b;
  --shadow:    0 6px 24px rgba(0,0,0,0.09);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.13);
  --r:         22px;
  --r2:        14px;
  --font:      'Segoe UI','Arial Hebrew',Arial,sans-serif;
  --sky1: #ffe8c8; --sky2: #ffd4a0;
}
[data-theme="night"] {
  --bg:    #12113a; --bg2:   #1c1b4a;
  --card:  #21204f; --card2: #2a2960;
  --border:#3a3870;
  --text:  #f0eeff; --text2: #9997cc;
  --sky1: #1c1a4a; --sky2: #12113a;
  --shadow:    0 6px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  overflow-x: hidden;
  transition: background 0.6s, color 0.4s;
  min-height: 100vh;
}

/* ══════════════════════════════════════════
   BACKGROUND DECORATIONS
══════════════════════════════════════════ */
#bg-deco {
  position: fixed; inset: 0; pointer-events: none;
  z-index: 0; overflow: hidden;
}
.deco { position: absolute; user-select: none; }

/* Sun */
.deco-sun {
  top: -30px; left: -30px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, #ffd97d 30%, transparent 70%);
  border-radius: 50%;
  animation: sunPulse 6s ease-in-out infinite;
  opacity: .55;
}
[data-theme="night"] .deco-sun { opacity: 0; }

/* Moon */
.deco-moon {
  top: 10px; left: 30px;
  font-size: 3.5rem;
  opacity: 0;
  animation: floatY 8s ease-in-out infinite;
  filter: drop-shadow(0 0 18px #a0b4ff);
}
[data-theme="night"] .deco-moon { opacity: .8; }

/* Clouds */
.deco-cloud {
  font-size: 3rem; opacity: .18;
  animation: drift linear infinite;
}
[data-theme="night"] .deco-cloud { opacity: 0; }
.cloud1 { top: 60px;  right: 5%;  animation-duration: 28s; font-size: 4rem; }
.cloud2 { top: 120px; left: 15%;  animation-duration: 38s; font-size: 2.8rem; animation-delay: -12s; }
.cloud3 { top: 30px;  right: 35%; animation-duration: 32s; font-size: 2.2rem; animation-delay: -7s; }

/* Stars */
.deco-star {
  font-size: 1.2rem; opacity: 0;
  animation: twinkle 3s ease-in-out infinite;
}
[data-theme="night"] .deco-star { opacity: .7; }
.star1  { top:8%;  left:12%;  animation-delay:0s;    font-size:1.4rem; }
.star2  { top:15%; left:55%;  animation-delay:.6s;   font-size:1rem; }
.star3  { top:6%;  left:78%;  animation-delay:1.1s;  font-size:1.6rem; }
.star4  { top:22%; left:32%;  animation-delay:1.8s;  font-size:.9rem; }
.star5  { top:10%; left:88%;  animation-delay:2.3s;  font-size:1.3rem; }
.star6  { top:30%; left:6%;   animation-delay:.4s;   font-size:1rem; }
.star7  { top:40%; left:93%;  animation-delay:1.5s;  font-size:1.1rem; }

/* Stickers */
.deco-sticker { font-size:1.8rem; opacity:.12; animation: floatY 7s ease-in-out infinite; }
[data-theme="night"] .deco-sticker { opacity:.06; }
.sticker1 { bottom:15%; right:3%;  animation-delay:0s; }
.sticker2 { bottom:35%; left:2%;   animation-delay:2s; font-size:1.4rem; }
.sticker3 { bottom:55%; right:5%;  animation-delay:4s; font-size:2rem; }

@keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes drift    { from{transform:translateX(110vw)} to{transform:translateX(-20vw)} }
@keyframes twinkle  { 0%,100%{opacity:.7;transform:scale(1)} 50%{opacity:.2;transform:scale(.7)} }
@keyframes floatY   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

/* ══════════════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════════════ */
#app { position: relative; z-index: 1; }

/* ══════════════════════════════════════════
   TOP NAV
══════════════════════════════════════════ */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1.5px solid var(--border);
  transition: background 0.4s;
}
[data-theme="night"] .nav {
  background: rgba(18,17,58,0.85);
  border-color: #3a3870;
}
.nav-logo { font-size: 1.3rem; font-weight: 900; color: var(--text); cursor: default; user-select: none; }
.nav-logo span { font-size: 1.5rem; }

.nav-tabs { display: flex; gap: 6px; }
.tab-btn {
  padding: 9px 18px; border: none; border-radius: 30px;
  cursor: pointer; font-size: .88rem; font-weight: 800;
  font-family: var(--font); background: var(--card2); color: var(--text2);
  transition: all .22s; border: 1.5px solid transparent;
}
.tab-btn.active {
  background: var(--accent); color: white;
  box-shadow: 0 4px 14px rgba(245,166,35,.38);
}
.tab-btn:not(.active):hover { background: var(--border); }

.nav-actions { display: flex; align-items: center; gap: 10px; }
.night-toggle {
  background: none; border: none; cursor: pointer;
  font-size: 1.4rem; padding: 4px; border-radius: 8px;
  transition: transform .3s;
}
.night-toggle:hover { transform: rotate(20deg) scale(1.15); }
.kid-mode-btn {
  background: #9b59b6; color: white; border: none;
  border-radius: 22px; padding: 8px 16px;
  font-size: .82rem; font-weight: 800; font-family: var(--font);
  cursor: pointer; box-shadow: 0 3px 10px rgba(155,89,182,.35);
  transition: all .2s;
}
.kid-mode-btn:hover { transform: scale(1.05); }

/* ══════════════════════════════════════════
   SCREENS
══════════════════════════════════════════ */
.screen { display: none; padding: 24px 20px 40px; max-width: 960px; margin: 0 auto; }
.screen.active { display: block; }

/* ══════════════════════════════════════════
   KID MODE OVERLAY
══════════════════════════════════════════ */
body.kid-mode .nav { display: none; }
body.kid-mode #screen-today { padding-top: 30px; }
.kid-exit-hint {
  display: none;
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.4); color: white; font-size: .78rem;
  padding: 8px 20px; border-radius: 30px; z-index: 500; pointer-events: none;
}
body.kid-mode .kid-exit-hint { display: block; }

/* ══════════════════════════════════════════
   TODAY SCREEN
══════════════════════════════════════════ */
.today-head {
  text-align: center; margin-bottom: 22px;
}
.today-greeting {
  font-size: 2rem; font-weight: 900; color: var(--text);
  margin-bottom: 4px;
}
.today-date-str {
  font-size: 1rem; color: var(--text2); font-weight: 600;
}
.today-banner {
  background: linear-gradient(135deg, #fff3dc, #ffecc4);
  border: 2.5px solid #f5c76a;
  border-radius: 18px;
  padding: 16px 24px; margin-bottom: 28px;
  text-align: center; font-size: 1.05rem; font-weight: 700;
  color: #a06800; line-height: 1.6;
}
[data-theme="night"] .today-banner {
  background: linear-gradient(135deg, #252558, #1e1d50);
  border-color: #5550b0; color: #c0baff;
}

/* Timeline */
.today-timeline { display: flex; flex-direction: column; gap: 16px; }

.today-card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  display: flex; align-items: center; gap: 18px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform .18s, box-shadow .18s;
  border: 2.5px solid transparent;
  -webkit-user-select: none; user-select: none;
}
.today-card::before {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 6px; border-radius: 0 var(--r) var(--r) 0;
  background: var(--person-color, var(--border));
  transition: background .3s;
}
.today-card:active { transform: scale(.97); }
.today-card.completed {
  opacity: .75;
  border-color: #6dbf8e44;
}
.today-card.completed::before { background: #6dbf8e; }

.tc-icon {
  font-size: 2.8rem; flex-shrink: 0;
  animation: floatY 5s ease-in-out infinite;
}
.tc-icon:nth-child(2) { animation-delay: 1.5s; }

.tc-info { flex: 1; }
.tc-task-name { font-size: 1.3rem; font-weight: 900; color: var(--text); line-height: 1.2; }
.tc-encourage {
  font-size: .88rem; color: var(--text2); margin-top: 5px;
  font-weight: 600; line-height: 1.4;
  transition: color .3s;
}
.tc-person-name {
  font-size: 1.05rem; font-weight: 800;
  margin-top: 3px;
}

.tc-photo-wrap {
  flex-shrink: 0; position: relative;
}
.tc-photo {
  width: 84px; height: 84px; border-radius: 50%;
  object-fit: cover; display: block;
  border: 4px solid white;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  transition: transform .3s;
}
.tc-photo-placeholder {
  width: 84px; height: 84px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; border: 4px solid white;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  background: #e8e4df;
}
.today-card:hover .tc-photo { transform: scale(1.06); }

/* Done checkmark */
.tc-done-badge {
  position: absolute; top: 12px; left: 14px;
  width: 36px; height: 36px;
  background: #6dbf8e; color: white;
  border-radius: 50%; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: scale(0);
  transition: all .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 3px 10px rgba(109,191,142,.45);
  z-index: 5;
}
.today-card.completed .tc-done-badge { opacity: 1; transform: scale(1); }

/* Sparkle particles */
.sparkle-particle {
  position: fixed; pointer-events: none; z-index: 999;
  font-size: 1.4rem;
  animation: sparklePop .7s ease-out forwards;
}
@keyframes sparklePop {
  0%   { transform: translate(0,0) scale(0); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
}

/* No person assigned */
.tc-empty { opacity: .55; }
.tc-empty .tc-encourage { font-style: italic; }
.tc-photo-empty {
  width: 84px; height: 84px; border-radius: 50%;
  border: 3px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: var(--text2); text-align: center;
  line-height: 1.3; padding: 8px;
}

/* ══════════════════════════════════════════
   WEEK SCREEN
══════════════════════════════════════════ */
.week-scroll-wrap { overflow-x: auto; padding-bottom: 14px; border-radius: 12px; }
.week-scroll-inner { min-width: 820px; }

.week-grid {
  display: grid;
  gap: 8px;
}
.week-header-row {
  display: grid;
  grid-template-columns: 150px repeat(7, 1fr);
  gap: 8px; margin-bottom: 2px;
}
.week-day-label {
  background: var(--card);
  border-radius: var(--r2);
  padding: 10px 6px;
  text-align: center; font-weight: 800;
  font-size: .88rem; color: var(--text);
  box-shadow: var(--shadow);
}
.week-day-label.today-col {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; box-shadow: 0 4px 14px rgba(245,166,35,.4);
}

.week-task-row {
  display: grid;
  grid-template-columns: 150px repeat(7, 1fr);
  gap: 8px;
}
.week-task-label {
  background: var(--card);
  border-radius: var(--r2);
  padding: 12px 12px;
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: .9rem; color: var(--text);
  box-shadow: var(--shadow);
}
.week-task-label .t-icon { font-size: 1.5rem; }

.week-cell {
  background: var(--card2);
  border-radius: var(--r2);
  min-height: 110px;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; padding: 10px 6px;
  border: 2.5px solid transparent;
  transition: all .22s;
  position: relative; overflow: hidden;
}
.week-cell:hover { transform: scale(1.04); box-shadow: var(--shadow-lg); }
.week-cell.today-col { border-color: var(--accent) !important; }

.wc-photo {
  width: 66px; height: 66px; border-radius: 50%;
  object-fit: cover;
  border: 3.5px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,.16);
  transition: transform .2s;
}
.week-cell:hover .wc-photo { transform: scale(1.08); }
.wc-photo-placeholder {
  width: 66px; height: 66px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; border: 3px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.wc-name {
  font-size: .72rem; font-weight: 800;
  text-align: center; line-height: 1.2;
  text-shadow: 0 1px 3px rgba(0,0,0,.18);
}
.wc-empty-label {
  font-size: .68rem; color: var(--text2);
  text-align: center; line-height: 1.4;
  padding: 0 4px;
}
.wc-empty-icon { font-size: 1.3rem; opacity: .35; }

/* ══════════════════════════════════════════
   PERSON PICKER MODAL
══════════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 300;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.modal {
  background: var(--card);
  border-radius: 28px; padding: 28px 24px;
  max-width: 400px; width: 92%;
  box-shadow: 0 30px 80px rgba(0,0,0,.25);
  direction: rtl; animation: slideUp .25s cubic-bezier(.34,1.4,.64,1);
}
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-title { font-size: 1.15rem; font-weight: 900; margin-bottom: 18px; color: var(--text); }

.picker-opts { display: flex; flex-direction: column; gap: 10px; }
.picker-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 16px; cursor: pointer;
  border: 3px solid transparent;
  background: var(--card2);
  transition: all .18s;
}
.picker-opt:hover { transform: scale(1.02); }
.picker-opt.sel { border-color: var(--person-color, var(--accent)); }
.picker-opt .po-photo {
  width: 54px; height: 54px; border-radius: 50%;
  object-fit: cover; border: 3px solid white;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.picker-opt .po-placeholder {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; border: 3px solid white;
}
.picker-opt .po-name { font-size: 1.08rem; font-weight: 800; color: var(--text); }
.picker-opt.empty-opt .po-name { color: var(--text2); }
.modal-footer { display: flex; justify-content: flex-end; margin-top: 16px; }

/* ══════════════════════════════════════════
   SETUP SCREEN
══════════════════════════════════════════ */
.setup-card {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 26px;
  margin-bottom: 22px;
}
.setup-card h2 {
  font-size: 1.15rem; font-weight: 900; color: var(--text);
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
}

.person-cards-wrap { display: flex; gap: 14px; flex-wrap: wrap; }
.p-setup-card {
  flex: 1; min-width: 150px;
  border-radius: 20px; padding: 22px 16px;
  text-align: center; border: 2.5px solid transparent;
  transition: all .2s; position: relative;
}
.p-photo-ring {
  width: 96px; height: 96px; border-radius: 50%;
  margin: 0 auto 14px; cursor: pointer;
  position: relative; overflow: hidden;
  border: 5px solid white; box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.p-photo-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }
.p-photo-ring .ph-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8rem;
}
.p-photo-ring .upload-ov {
  position: absolute; inset: 0; background: rgba(0,0,0,.48);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; opacity: 0; transition: opacity .2s;
}
.p-photo-ring:hover .upload-ov { opacity: 1; }

.p-name-input {
  width: 100%; text-align: center; direction: rtl;
  border: 2px solid var(--border); border-radius: 12px;
  padding: 9px 10px; font-size: .95rem; font-weight: 700;
  font-family: var(--font); color: var(--text);
  background: var(--card); margin-bottom: 10px;
  transition: border-color .2s;
}
.p-name-input:focus { outline: none; border-color: var(--accent); }
.color-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
.color-row label { font-size: .8rem; color: var(--text2); font-weight: 600; }
input[type="color"] {
  width: 32px; height: 32px; border-radius: 50%; border: 3px solid white;
  cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  padding: 0; overflow: hidden;
}

.tasks-list-wrap { display: flex; flex-direction: column; gap: 10px; }
.task-edit-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--card2); border-radius: 14px;
  padding: 11px 14px;
}
.task-icon-in {
  width: 56px; border: 2px solid var(--border); border-radius: 10px;
  padding: 8px; font-size: 1rem; text-align: center;
  font-family: var(--font); background: var(--card); color: var(--text);
}
.task-name-in {
  flex: 1; border: 2px solid var(--border); border-radius: 10px;
  padding: 9px 12px; font-size: .95rem; font-family: var(--font);
  color: var(--text); background: var(--card); direction: rtl;
}
.task-icon-in:focus, .task-name-in:focus { outline: none; border-color: var(--accent); }
.btn-icon-rm {
  background: none; border: none; font-size: 1.3rem;
  cursor: pointer; padding: 6px; border-radius: 8px;
  transition: background .15s; color: var(--text2);
}
.btn-icon-rm:hover { background: #ffe0e0; color: #e05555; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: 14px; padding: 12px 22px; font-size: .95rem; font-weight: 800; font-family: var(--font); cursor: pointer; transition: all .2s; }
.btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 16px rgba(245,166,35,.38); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(245,166,35,.45); }
.btn-secondary { background: var(--card2); color: var(--text2); border: 2px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: white; color: #e04a4a; border: 2px solid #e04a4a; }
.btn-danger:hover { background: #fff0f0; }
.btn-add { background: var(--card2); color: var(--text2); border: 2px dashed var(--border); border-radius: 14px; padding: 12px 18px; font-size: .92rem; font-weight: 700; font-family: var(--font); cursor: pointer; transition: all .2s; direction: rtl; }
.btn-add:hover { background: var(--border); }

.action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

/* hidden inputs */
.hidden-input { display: none; }

/* scroll hint */
.scroll-hint { font-size: .75rem; color: var(--text2); text-align: center; margin-bottom: 10px; }

/* week top actions */
.week-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media (max-width: 600px) {
  .nav-logo { font-size: 1.1rem; }
  .tab-btn { padding: 7px 12px; font-size: .8rem; }
  .kid-mode-btn { padding: 7px 12px; font-size: .78rem; }
  .today-greeting { font-size: 1.6rem; }
  .tc-photo, .tc-photo-placeholder { width: 72px; height: 72px; }
  .person-cards-wrap { flex-direction: column; }
}
</style>
</head>
<body>

<!-- background decorations -->
<div id="bg-deco" aria-hidden="true">
  <div class="deco deco-sun"></div>
  <div class="deco deco-moon">🌙</div>
  <div class="deco deco-cloud cloud1">☁️</div>
  <div class="deco deco-cloud cloud2">⛅</div>
  <div class="deco deco-cloud cloud3">☁️</div>
  <div class="deco deco-star star1">⭐</div>
  <div class="deco deco-star star2">✨</div>

<script>
// ═══════════════════════════════════════════════
// DEFAULTS
// ═══════════════════════════════════════════════
const DEFAULT_PEOPLE = [
  { id:'sagi',  name:'אבא שגיא',  color:'#5b9bd5', photo:null },
  { id:'tzlil', name:'אמא צליל', color:'#e07baa', photo:null },
  { id:'neil',  name:'ניל',       color:'#6dbf8e', photo:null },
];
const DEFAULT_TASKS = [
  { id:'t1', name:'איסוף מהגן',    icon:'🏫' },
  { id:'t2', name:'מקלחת',          icon:'🛁' },
  { id:'t3', name:'צחצוח שיניים', icon:'🪥' },
  { id:'t4', name:'סיפור ושינה',  icon:'📖🌙' },
];
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

// Encouraging messages: [personId or '*', taskName fragment or '*', message]
const ENCOURAGEMENTS = [
  ['sagi',  'איסוף',   'אבא שגיא בדרך לאסוף אותך! 🚗'],
  ['tzlil', 'איסוף',   'אמא צליל באה לאסוף אותך! 🌸'],
  ['neil',  'איסוף',   'ניל מגיע לאסוף אותך! 🎒'],
  ['sagi',  'מקלחת',   'איזה כיף, אבא איתך במקלחת! 🛁'],
  ['tzlil', 'מקלחת',   'אמא עוזרת לך במקלחת 💕'],
  ['neil',  'מקלחת',   'ניל עוזר לך להתקלח! 🚿'],
  ['sagi',  'צחצוח',   'אבא מצחצח איתך — שיניים מבריקות! ✨'],
  ['tzlil', 'צחצוח',   'אמא מצחצחת איתך — יאמי! 🪥'],
  ['neil',  'צחצוח',   'ניל מצחצח איתך! 😁'],
  ['sagi',  'סיפור',   'אבא מקריא סיפור הערב 📖'],
  ['tzlil', 'סיפור',   'היום אמא מקריאה סיפור ❤️'],
  ['neil',  'סיפור',   'ניל מספר לך סיפור מדהים! 🌟'],
];

function getEncourage(personId, taskName) {
  if (!personId) return 'עדיין לא נבחר מי מלווה';
  for (const [pid, frag, msg] of ENCOURAGEMENTS) {
    if (pid === personId && taskName.includes(frag)) return msg;
  }
  const p = state.people.find(p => p.id === personId);
  return p ? `${p.name} איתך היום! 💛` : '';
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let state = { people:[], tasks:[], assignments:{}, completedToday:{} };

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem('family-routine-v2');
    if (raw) {
      const parsed = JSON.parse(raw);
      state.people      = parsed.people      || JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
      state.tasks       = parsed.tasks       || JSON.parse(JSON.stringify(DEFAULT_TASKS));
      state.assignments = parsed.assignments || {};
      // completedToday keyed by date so it auto-resets each day
      const ct = parsed.completedToday || {};
      state.completedToday = ct[todayKey()] ? ct : {};
      if (!state.completedToday[todayKey()]) state.completedToday[todayKey()] = {};
    } else {
      state.people = JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
      state.tasks  = JSON.parse(JSON.stringify(DEFAULT_TASKS));
      state.assignments = {};
      state.completedToday = { [todayKey()]: {} };
    }
  } catch(e) {
    state.people = JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
    state.tasks  = JSON.parse(JSON.stringify(DEFAULT_TASKS));
    state.assignments = {};
    state.completedToday = { [todayKey()]: {} };
  }
}

function saveState() {
  localStorage.setItem('family-routine-v2', JSON.stringify(state));
}

function isDone(taskId) {
  return !!(state.completedToday[todayKey()] || {})[taskId];
}
function setDone(taskId, val) {
  if (!state.completedToday[todayKey()]) state.completedToday[todayKey()] = {};
  if (val) state.completedToday[todayKey()][taskId] = true;
  else delete state.completedToday[todayKey()][taskId];
  saveState();
}

// ═══════════════════════════════════════════════
// NIGHT MODE
// ═══════════════════════════════════════════════
let nightManual = null; // null = auto, true/false = forced

function isNightTime() {
  const h = new Date().getHours();
  return h >= 20 || h < 6;
}
function applyTheme() {
  const night = nightManual !== null ? nightManual : isNightTime();
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');
  document.getElementById('night-btn').textContent = night ? '☀️' : '🌙';
}
function toggleNight() {
  const curr = document.documentElement.getAttribute('data-theme') === 'night';
  nightManual = !curr;
  applyTheme();
}

// ═══════════════════════════════════════════════
// KID MODE
// ═══════════════════════════════════════════════
let logoTapCount = 0, logoTapTimer = null;

document.getElementById('nav-logo-tap').addEventListener('click', () => {
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1000);
  if (logoTapCount >= 3) {
    logoTapCount = 0;
    exitKidMode();
  }
});

function enterKidMode() {
  document.body.classList.add('kid-mode');
  showScreen('today');
}
function exitKidMode() {
  document.body.classList.remove('kid-mode');
}

// ═══════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  const idx = ['today','week','setup'].indexOf(name);
  if (idx >= 0) document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if (name === 'today') renderToday();
  if (name === 'week')  renderWeek();
  if (name === 'setup') renderSetup();
}

// ═══════════════════════════════════════════════
// TODAY
// ═══════════════════════════════════════════════
function todayDayIndex() { return new Date().getDay(); }

const GREETINGS_DAY   = ['בוקר טוב! ☀️','יום נפלא! 🌤️','יופי של יום! 🌈'];
const GREETINGS_NIGHT = ['לילה טוב! 🌙','שינה מתוקה! 💤','ערב קסום! ✨'];
let greetIdx = Math.floor(Math.random() * 3);

function renderToday() {
  applyTheme();
  const dayIdx   = todayDayIndex();
  const dayName  = DAYS[dayIdx];
  const night    = document.documentElement.getAttribute('data-theme') === 'night';
  const arr      = night ? GREETINGS_NIGHT : GREETINGS_DAY;

  document.getElementById('today-greeting').textContent = `${arr[greetIdx]} יום ${dayName}`;
  const now = new Date();
  document.getElementById('today-date-str').textContent =
    now.toLocaleDateString('he-IL', { year:'numeric', month:'long', day:'numeric' });

  const tl = document.getElementById('today-timeline');
  tl.innerHTML = '';

  if (!state.tasks.length) {
    tl.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px">אין משימות מוגדרות</div>';
    return;
  }

  state.tasks.forEach(task => {
    const key      = `${dayIdx}_${task.id}`;
    const personId = state.assignments[key] || null;
    const person   = personId ? state.people.find(p => p.id === personId) : null;
    const color    = person ? person.color : null;
    const done     = isDone(task.id);
    const encourage= getEncourage(personId, task.name);

    const card = document.createElement('div');
    card.className = 'today-card' + (done ? ' completed' : '') + (!personId ? ' tc-empty' : '');
    card.style.setProperty('--person-color', color || 'var(--border)');
    if (color) card.style.background = hexToRgba(color, .06);

    // photo
    let photoHtml;
    if (person && person.photo) {
      photoHtml = `<img src="${person.photo}" class="tc-photo" alt="${person.name}">`;
    } else if (person) {
      photoHtml = `<div class="tc-photo-placeholder" style="background:${hexToRgba(color,.15)};border-color:${color}40">😊</div>`;
    } else {
      photoHtml = `<div class="tc-photo-empty">בחרו<br>מי<br>מלווה</div>`;
    }

    card.innerHTML = `
      <div class="tc-done-badge">✓</div>
      <span class="tc-icon">${task.icon}</span>
      <div class="tc-info">
        <div class="tc-task-name">${task.name}</div>
        ${person ? `<div class="tc-person-name" style="color:${color}">${person.name}</div>` : ''}
        <div class="tc-encourage">${encourage}</div>
      </div>
      <div class="tc-photo-wrap">${photoHtml}</div>
    `;

    card.addEventListener('click', (e) => {
      if (!personId) return;
      const nowDone = isDone(task.id);
      setDone(task.id, !nowDone);
      card.classList.toggle('completed', !nowDone);
      if (!nowDone) {
        spawnSparkles(e.clientX, e.clientY);
        showCelebration(person);
      }
    });

    tl.appendChild(card);
  });
}

function spawnSparkles(cx, cy) {
  const emojis = ['⭐','✨','🌟','💛','🎉','💫'];
  for (let i = 0; i < 9; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle-particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (Math.PI * 2 * i) / 9 + Math.random() * .6;
    const dist  = 60 + Math.random() * 80;
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    el.style.animationDelay = (Math.random() * 0.15) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

// brief "כל הכבוד" toast
function showCelebration(person) {
  const msgs = ['כל הכבוד! 🌟', 'מצוין! ✨', 'יופי! 🎉', 'אלוף! 💪'];
  const toast = document.createElement('div');
  toast.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  Object.assign(toast.style, {
    position:'fixed', top:'50%', left:'50%',
    transform:'translate(-50%,-50%) scale(0)',
    background: person ? person.color : '#f5a623',
    color:'white', fontSize:'2rem', fontWeight:'900',
    padding:'18px 36px', borderRadius:'22px',
    boxShadow:'0 12px 40px rgba(0,0,0,.25)',
    zIndex:'999', pointerEvents:'none', fontFamily:'var(--font)',
    transition:'transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s',
  });
  document.body.appendChild(toast);
  requestAnimationFrame(() => { toast.style.transform = 'translate(-50%,-50%) scale(1)'; });
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translate(-50%,-60%) scale(.8)';
    setTimeout(() => toast.remove(), 350);
  }, 1100);
}

// ═══════════════════════════════════════════════
// WEEK BOARD
// ═══════════════════════════════════════════════
function renderWeek() {
  const todayIdx = todayDayIndex();

  // header
  const hdr = document.getElementById('week-header');
  hdr.innerHTML = '<div></div>'; // spacer for task-label column
  DAYS.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'week-day-label' + (i === todayIdx ? ' today-col' : '');
    el.textContent = d;
    hdr.appendChild(el);
  });

  const body = document.getElementById('week-body');
  body.innerHTML = '';

  state.tasks.forEach(task => {
    const row = document.createElement('div');
    row.className = 'week-task-row';

    const lbl = document.createElement('div');
    lbl.className = 'week-task-label';
    lbl.innerHTML = `<span class="t-icon">${task.icon}</span><span>${task.name}</span>`;
    row.appendChild(lbl);

    DAYS.forEach((_, dayIdx) => {
      const key      = `${dayIdx}_${task.id}`;
      const personId = state.assignments[key] || null;
      const cell     = buildWeekCell(dayIdx, task.id, personId, dayIdx === todayIdx);
      row.appendChild(cell);
    });

    body.appendChild(row);
  });
}

function buildWeekCell(dayIdx, taskId, personId, isToday) {
  const person = personId ? state.people.find(p => p.id === personId) : null;
  const cell   = document.createElement('div');
  cell.className = 'week-cell' + (isToday ? ' today-col' : '');

  if (person) {
    cell.style.background = hexToRgba(person.color, .13);
    cell.style.borderColor = hexToRgba(person.color, isToday ? 1 : .25);

    let ph;
    if (person.photo) {
      ph = `<img src="${person.photo}" class="wc-photo" alt="${person.name}" style="border-color:${person.color}40">`;
    } else {
      ph = `<div class="wc-photo-placeholder" style="background:${hexToRgba(person.color,.2)};border-color:${person.color}40">😊</div>`;
    }
    cell.innerHTML = `${ph}<span class="wc-name" style="color:${person.color}">${person.name}</span>`;
  } else {
    cell.innerHTML = `
      <span class="wc-empty-icon">👤</span>
      <span class="wc-empty-label">בחרו<br>מי מלווה</span>`;
  }

  cell.addEventListener('click', () => openPicker(dayIdx, taskId));
  return cell;
}

// ═══════════════════════════════════════════════
// PICKER MODAL
// ═══════════════════════════════════════════════
let pickerCtx = null;

function openPicker(dayIdx, taskId) {
  pickerCtx = { dayIdx, taskId };
  const task    = state.tasks.find(t => t.id === taskId);
  const current = state.assignments[`${dayIdx}_${taskId}`] || null;

  document.getElementById('picker-title').textContent =
    `${task ? task.icon + ' ' + task.name : ''} — יום ${DAYS[dayIdx]}`;

  const opts = document.getElementById('picker-opts');
  opts.innerHTML = '';

  // empty
  const empty = buildPickerOpt(null, current);
  opts.appendChild(empty);

  state.people.forEach(p => {
    opts.appendChild(buildPickerOpt(p, current));
  });

  document.getElementById('picker-modal').classList.add('open');
}

function buildPickerOpt(person, current) {
  const opt = document.createElement('div');
  const isSel = (!person && !current) || (person && person.id === current);
  opt.className = 'picker-opt' + (isSel ? ' sel' : '') + (!person ? ' empty-opt' : '');
  if (person) opt.style.setProperty('--person-color', person.color);

  let ph;
  if (!person) {
    ph = `<div class="po-placeholder" style="background:#e0ddd8">—</div>`;
  } else if (person.photo) {
    ph = `<img src="${person.photo}" class="po-photo">`;
  } else {
    ph = `<div class="po-placeholder" style="background:${hexToRgba(person.color,.25)}">😊</div>`;
  }

  opt.innerHTML = `${ph}<span class="po-name">${person ? person.name : 'לא הוגדר'}</span>`;
  if (isSel && person) opt.style.borderColor = person.color;

  opt.addEventListener('click', () => applyPick(person ? person.id : null));
  return opt;
}

function applyPick(personId) {
  if (!pickerCtx) return;
  const { dayIdx, taskId } = pickerCtx;
  const key = `${dayIdx}_${taskId}`;
  if (personId) state.assignments[key] = personId;
  else delete state.assignments[key];
  saveState();
  closePicker();
  renderWeek();
}

function closePicker() {
  document.getElementById('picker-modal').classList.remove('open');
  pickerCtx = null;
}
document.getElementById('picker-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('picker-modal')) closePicker();
});

// ═══════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════
function renderSetup() {
  renderPersonCards();
  renderTasksList();
}

function renderPersonCards() {
  const wrap = document.getElementById('person-cards');
  wrap.innerHTML = '';
  state.people.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'p-setup-card';
    card.style.background = `linear-gradient(145deg, ${hexToRgba(p.color,.12)}, ${hexToRgba(p.color,.04)})`;
    card.style.borderColor = hexToRgba(p.color, .35);

    const photoContent = p.photo
      ? `<img src="${p.photo}" alt="${p.name}">`
      : `<div class="ph-placeholder" style="background:${hexToRgba(p.color,.25)}">😊</div>`;

    card.innerHTML = `
      <div class="p-photo-ring" onclick="document.getElementById('pup${i}').click()">
        ${photoContent}
        <div class="upload-ov">📷</div>
      </div>
      <input class="p-name-input" id="pname${i}" value="${p.name}" style="border-color:${hexToRgba(p.color,.4)}">
      <div class="color-row">
        <label>צבע</label>
        <input type="color" id="pcolor${i}" value="${p.color}" onchange="updateColor(${i},this.value)">
      </div>
    `;
    wrap.appendChild(card);
  });
}

function updateColor(i, val) {
  state.people[i].color = val;
  renderPersonCards();
}

function handlePhotoUpload(i, e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { state.people[i].photo = ev.target.result; renderPersonCards(); };
  r.readAsDataURL(f);
}

function renderTasksList() {
  const list = document.getElementById('tasks-list');
  list.innerHTML = '';
  state.tasks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'task-edit-row';
    row.innerHTML = `
      <input class="task-icon-in" id="ticon${i}" value="${t.icon}" maxlength="4">
      <input class="task-name-in" id="tname${i}" value="${t.name}">
      <button class="btn-icon-rm" onclick="removeTask(${i})">🗑️</button>
    `;
    list.appendChild(row);
  });
}

function addTask() {
  state.tasks.push({ id:'t' + Date.now(), name:'משימה חדשה', icon:'⭐' });
  renderTasksList();
}
function removeTask(i) {
  const id = state.tasks[i].id;
  state.tasks.splice(i, 1);
  Object.keys(state.assignments).forEach(k => { if (k.endsWith('_'+id)) delete state.assignments[k]; });
  renderTasksList();
}

function saveSetup() {
  state.people.forEach((p, i) => {
    const n = document.getElementById(`pname${i}`);
    if (n) p.name = n.value.trim() || p.name;
  });
  state.tasks.forEach((t, i) => {
    const ic = document.getElementById(`ticon${i}`);
    const nm = document.getElementById(`tname${i}`);
    if (ic) t.icon = ic.value || t.icon;
    if (nm) t.name = nm.value.trim() || t.name;
  });
  saveState();
  showScreen('today');
}

// ═══════════════════════════════════════════════
// RESET / EXPORT / IMPORT
// ═══════════════════════════════════════════════
function confirmReset() {
  if (confirm('לאפס את כל השיבוצים בלוח?\n(ההגדרות והתמונות ישמרו)')) {
    state.assignments = {};
    saveState(); renderWeek();
  }
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'family-routine-backup.json'
  });
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.tasks && d.people) {
        state = d;
        if (!state.completedToday) state.completedToday = {};
        saveState(); showScreen('week');
        alert('הגיבוי יובא בהצלחה ✅');
      } else alert('קובץ לא תקין');
    } catch { alert('שגיאה בקריאת הקובץ'); }
  };
  r.readAsText(f); e.target.value = '';
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadState();
applyTheme();
renderToday();

// auto re-apply night mode every minute
setInterval(applyTheme, 60000);
</script>
